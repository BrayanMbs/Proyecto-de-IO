<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>📦 Simulador de Modelos de Inventario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Tu CSS personalizado -->
  <link rel="stylesheet" href="styles.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container my-5 p-4 bg-white rounded-4 shadow-lg">
    <h1 class="text-center text-primary fw-bold mb-4">📦 Simulador de Modelos de Inventario</h1>

    <form id="formulario" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Demanda anual (D):</label>
        <input type="number" class="form-control" id="D" placeholder="Ejemplo: 100">
      </div>

      <div class="col-md-6">
        <label class="form-label">Costo de pedido (S):</label>
        <input type="number" class="form-control" id="S" placeholder="Ejemplo: 50000">
      </div>

      <div class="col-md-6">
        <label class="form-label">Costo de mantenimiento (H):</label>
        <input type="number" class="form-control" id="H" placeholder="Ejemplo: 336000">
      </div>

      <div class="col-md-6">
        <label class="form-label">Tasa de producción (P) [solo para Lote Económico]:</label>
        <input type="number" class="form-control" id="P" placeholder="Ejemplo: 300">
      </div>

      <div class="col-md-6">
        <label class="form-label">Costo de escasez (Cs) [solo para Escasez Planeada]:</label>
        <input type="number" class="form-control" id="Cs" placeholder="Ejemplo: 150000">
      </div>

      <div class="col-12 text-center mt-4">
        <button type="button" class="btn btn-primary btn-lg px-5" onclick="clasificarModelo()">Calcular</button>
      </div>
    </form>

    <h2 class="mt-5 border-bottom border-3 border-primary pb-2">📊 Resultados</h2>
    <div id="resultados" class="resultado-box mt-4"></div>
    <div id="interpretacion" class="resultado-texto mt-3"></div>
    <canvas id="grafico" class="mt-4"></canvas>
  </div>

  <script src="js/eoq.js"></script>
  <script src="js/epq.js"></script>
  <script src="js/shortage.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
